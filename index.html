</style></head><body><div class="layout"><aside class="rail"><div class="brand">FULL<em>COURT.</em><small>DYNASTY MODE</small></div><div id="nav"></div><div class="rail-foot"><strong>THE ROAD TO MARCH</strong><p class="tiny">Every season is a story. Every decision matters.</p></div></aside><main class="main"><div id="app"></div></main></div><div id="toast" class="toast hidden"></div><div id="modal" class="modalwrap hidden"></div><script>
const NAMES=['Darius King','Malik Henderson','Jalen Cross','Tyrese Mercer','Cam Whitfield','Eli Brooks','Zion Holloway','Jordan Fields','KJ Rivers','Andre Coleman','Devin Scott','Micah Hayes','Noah Carter','Isaiah Grant','Trey Bennett','Javon Mitchell','Kobe Lawson','Miles Porter','Jace Williams','Amari Ellis','Luca Marino','Jamal Price','Dante Foster','Chris Vaughn','RJ Parker','Quincy Rhodes','Marcus Bell','Keon Walker','Mason Young','Brandon Knox','Dre Owens','Nico Harris','AJ Simmons','Bryce Bailey','Tyrell Stone','Elijah Ward','Jaylen Moore','Damon Carter','Cade Pierce','Terrence Ross'];

const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const sample=a=>a[rand(0,a.length-1)];const $=s=>document.querySelector(s);const position=['PG','SG','SF','PF','C'];
function makePlayer(id,boost=0){let ov=clamp(rand(64,84)+boost,55,96),yr=rand(1,4),p={id,name:NAMES[(id*7+rand(0,39))%NAMES.length],pos:position[id%5],year:yr,ovr:ov,pot:clamp(ov+rand(4,17),ov,99),shoot:clamp(ov+rand(-17,12),35,98),def:clamp(ov+rand(-16,15),35,98),ath:clamp(ov+rand(-15,15),35,98),mood:rand(65,96),fatigue:0,traits:sample(['CLUTCH','SNIPER','LOCKDOWN','FLOOR GENERAL','HIGHLIGHT REEL','GLASS CLEANER','MICROWAVE','UNDERDOG','WORKHORSE']),skin:sample(['#6c412f','#a86641','#d39564','#e9bc8d','#422b25','#9c6044']),hair:sample(['#17191a','#201813','#30241a']),number:rand(0,55),ppg:0,apg:0,rpg:0,games:0};return p}
let state;function defaultState(ix=0,coach='Coach Carter'){let team=PROGRAMS[ix];let roster=Array.from({length:11},(_,i)=>makePlayer(i+1,Math.round((team.prestige-75)/4)));roster.sort((a,b)=>b.ovr-a.ovr);let schedule=Array.from({length:22},(_,i)=>{let choices=PROGRAMS.filter(t=>t.abbr!==team.abbr);return {op:sample(choices).abbr,home:i%3!==1,played:false,conference:i>=7&&i<20}});return {version:2,coach,team:team.abbr,season:2026,week:0,wins:0,losses:0,confW:0,confL:0,prestige:team.prestige,momentum:54,fans:rand(51,78),chemistry:72,budget:950,roster,schedule,news:[`Welcome to ${team.name}! The ${team.mascot} are entering a new era under ${coach}.`],recruits:Array.from({length:9},(_,i)=>createRecruit(100+i)),offers:[],training:'balanced',scheme:'balanced',pace:'normal',game:null,history:[],achievements:[],tourney:false,round:0,seasonDone:false,facilities:1,scouting:1,injury:null,portal:[],draft:[]}}
function createRecruit(id){let o=rand(67,90);return {...makePlayer(id,o-75),id,ovr:o,pot:clamp(o+rand(5,15),o,99),stars:o>=85?5:o>=78?4:3,interest:rand(23,68),cost:rand(140,320),signed:false,scholarship:false}}
const save=()=>localStorage.setItem('fullcourt_dynasty_v2',JSON.stringify(state));const getTeam=(ab)=>PROGRAMS.find(t=>t.abbr===ab)||PROGRAMS[0];const myTeam=()=>getTeam(state.team);const avg=()=>Math.round(state.roster.slice(0,8).reduce((a,p)=>a+p.ovr,0)/Math.max(1,Math.min(8,state.roster.length)));const record=()=>`${state.wins}-${state.losses}`;const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='dashboard',rosterSort='ovr',recruitFilter='all',playSpeed='normal';const NAV=[['dashboard','▦','Command Center'],['schedule','▤','Season & Schedule'],['game','◉','Game Day'],['roster','♟','Locker Room'],['recruiting','✦','Recruiting'],['training','⌁','Player Development'],['rankings','♛','National Pulse'],['legacy','★','Legacy & Records']];
const teamIcon=(t,big=false)=>`<div class="team-mark" style="--tc:${t.color};${big?'width:66px;height:66px;font-size:26px':''}">${t.abbr.slice(0,3)}</div>`;
const port=(p)=>`<div class="portrait" style="--skin:${p.skin};--hair:${p.hair};--jersey:${myTeam().color};--pc:${myTeam().color}"><div class="body"></div><div class="head"></div><div class="number">${p.number}</div></div>`;
function stat(label,val,note='',color=''){return `<div class="card span3"><div class="statnum" ${color?`style="color:${color}"`:''}>${val}</div><div class="statlab">${label}</div>${note?`<div class="statnote">${note}</div>`:''}</div>`}
const nextGame=()=>state.schedule.find(x=>!x.played);
function header(label,title,sub,action=''){return `<div class="top"><div><div class="eyebrow">${label} / ${state.season}-${String(state.season+1).slice(2)}</div><h1 class="title">${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="top-right"><span class="pill">${myTeam().name} • ${record()}</span>${action}</div></div>`}
function render(){if(!state)return;$('#nav').innerHTML=NAV.map(([id,ico,name])=>`<button class="nav ${page===id?'active':''}" onclick="goto('${id}')"><i>${ico}</i><span>${name}</span></button>`).join('');let map={dashboard,schedule,game,roster,recruiting,training,rankings,legacy};$('#app').innerHTML=map[page]();}
function goto(p){page=p;render();window.scrollTo(0,0)}
function dashboard(){let n=nextGame(),opp=n?getTeam(n.op):null,leaders=state.roster.slice(0,3);return header('Dynasty HQ','THE PROGRAM',`Head Coach ${escapeHTML(state.coach)} • ${myTeam().conference} Conference`, `<button class="btn secondary sm" onclick="openSettings()">⚙ Dynasty Options</button>`)+`<div class="grid"><div class="span12 hero"><div style="position:relative;z-index:1"><div class="eyebrow">WELCOME TO THE GRIND • WEEK ${Math.min(state.week+1,23)}</div><h2>BUILD A <b>BLUE BLOOD.</b><br>WRITE YOUR LEGACY.</h2><p>Recruit overlooked stars. Develop monsters. Win the rivalry. Survive March. The program is yours to build.</p><div class="hero-actions"><button class="btn" onclick="goto('${state.game?'game':n?'game':'legacy'}')">${state.game?'RESUME GAME →':n?'NEXT GAME →':'VIEW LEGACY →'}</button><button class="btn ghost" onclick="goto('recruiting')">SCOUT THE FUTURE</button></div></div><div class="hero-ball"><div class="ball"></div></div></div>${stat('SEASON RECORD',record(),`${state.confW}-${state.confL} conference`)}${stat('PROGRAM RATING',avg(),'Starting eight overall')}${stat('FAN HYPE',state.fans+'%',state.fans>75?'THE CITY IS BUZZING':'Build the atmosphere')}${stat('RECRUITING CASH','$'+state.budget,'Spend it strategically')}<div class="card span7"><div class="section-head"><h3>UP NEXT // THE MATCHUP</h3><span class="tag">${n?'GAME '+(state.week+1):'SEASON COMPLETE'}</span></div>${n?`<div class="flex" style="padding:14px 0"><div class="who">${teamIcon(myTeam(),true)}<div><strong>${myTeam().name}</strong><div class="tiny">${n.home?'HOME':'AWAY'} • ${record()}</div></div></div><span style="font:900 26px Impact,'Arial Narrow',sans-serif">VS</span><div class="who">${teamIcon(opp,true)}<div><strong>${opp.name}</strong><div class="tiny">${opp.conference}</div></div></div></div><div class="sep"></div><div class="flex"><span class="muted">${n.conference?'CONFERENCE GAME':'NON-CONFERENCE GAME'} • ${n.home?'THE STUDENT SECTION IS READY':'HOSTILE TERRITORY'}</span><button class="btn" onclick="goto('game')">ENTER ARENA →</button></div>`:`<p class="muted">Your regular-season schedule is complete.</p><button class="btn" onclick="goto('game')">POSTSEASON →</button>`}</div><div class="card span5"><h3>THE CAMPUS WIRE <span style="color:var(--lime)">●</span></h3>${state.news.slice(0,5).map((x,i)=>`<div class="news"><time>${i===0?'LATEST STORY':'CAMPUS REPORT'}</time><p>${escapeHTML(x)}</p></div>`).join('')}</div><div class="card span7"><div class="section-head"><h3>THE STARTING CORE</h3><button class="btn secondary sm" onclick="goto('roster')">FULL ROSTER →</button></div>${leaders.map(p=>`<div class="listrow"><div class="rowp">${port(p)}<div><strong>${p.name}</strong><div class="tiny">${p.pos} • ${['FR','SO','JR','SR'][p.year-1]} • ${p.traits}</div></div></div><div style="text-align:right"><div class="rating">${p.ovr}</div><div class="tiny">OVR</div></div></div>`).join('')}</div><div class="card span5"><h3>PROGRAM TEMPERATURE</h3>${[['Team chemistry',state.chemistry],['Momentum',state.momentum],['Fan hype',state.fans],['School prestige',state.prestige]].map(([l,v])=>`<div style="margin:22px 0"><div class="flex" style="margin-bottom:8px"><strong>${l}</strong><span>${v}/100</span></div><div class="progress"><span style="width:${v}%"></span></div></div>`).join('')}</div></div>`}
function schedule(){return header('Scouting desk','THE SCHEDULE','Every game is a chance to put your school on the map.')+`<div class="grid"><div class="card span8"><h3>2026–27 REGULAR SEASON</h3>${state.schedule.map((g,i)=>{let t=getTeam(g.op);return `<div class="schedule-row"><div class="who"><span class="muted" style="width:35px;font-weight:800">W${i+1}</span>${teamIcon(t)}<div><strong>${g.home?'vs':'@'} ${t.name}</strong><div class="tiny">${g.conference?'CONFERENCE':'NON-CONFERENCE'} • ${g.home?'HOME':'ROAD'}</div></div></div><div>${g.played?`<span class="tag ${g.win?'':'red'}">${g.win?'W':'L'} ${g.score}-${g.theirs}</span>`:i===state.week?'<span class="tag blue">NEXT UP</span>':'<span class="muted">UPCOMING</span>'}</div></div>`}).join('')}</div><div class="card span4"><h3>SEASON SNAPSHOT</h3><div class="statnum">${record()}</div><div class="statlab">OVERALL RECORD</div><div class="sep"></div><div class="flex"><strong>Conference</strong><span>${state.confW}-${state.confL}</span></div><div class="sep"></div><div class="flex"><strong>Remaining</strong><span>${state.schedule.filter(g=>!g.played).length} games</span></div><div class="sep"></div><div class="flex"><strong>Last five</strong><span>${state.schedule.filter(g=>g.played).slice(-5).map(g=>g.win?'W':'L').join(' · ')||'—'}</span></div><div class="sep"></div><button class="btn" style="width:100%" onclick="goto('game')">GAME DAY →</button></div></div>`}
function roster(){let sorted=[...state.roster].sort((a,b)=>rosterSort==='ovr'?b.ovr-a.ovr:rosterSort==='age'?a.year-b.year:b[rosterSort]-a[rosterSort]);return header('The locker room','MEET THE SQUAD',`${state.roster.length} scholarship athletes • ${myTeam().name} ${myTeam().mascot}`)+`<div class="grid">${stat('TEAM OVERALL',avg())}${stat('CHEMISTRY',state.chemistry+'%')}${stat('ROSTER SPOTS',`${state.roster.length}/15`)}${stat('SENIORS',state.roster.filter(p=>p.year===4).length)}<div class="card span12"><div class="section-head"><h3>PLAYER PERSONNEL</h3><select class="select" onchange="rosterSort=this.value;render()"><option value="ovr" ${rosterSort==='ovr'?'selected':''}>SORT: OVERALL</option><option value="shoot" ${rosterSort==='shoot'?'selected':''}>SHOOTING</option><option value="def" ${rosterSort==='def'?'selected':''}>DEFENSE</option><option value="ath" ${rosterSort==='ath'?'selected':''}>ATHLETICISM</option><option value="age" ${rosterSort==='age'?'selected':''}>CLASS</option></select></div><div style="overflow-x:auto"><table><thead><tr><th>PLAYER</th><th>POS</th><th>YEAR</th><th>OVR</th><th>SHOT</th><th>DEF</th><th>ATH</th><th>POT</th><th>TRAIT</th><th></th></tr></thead><tbody>${sorted.map(p=>`<tr><td><div class="rowp">${port(p)}<strong>${p.name}</strong></div></td><td>${p.pos}</td><td>${['FR','SO','JR','SR'][p.year-1]}</td><td><b style="color:var(--lime)">${p.ovr}</b></td><td>${p.shoot}</td><td>${p.def}</td><td>${p.ath}</td><td>${p.pot}</td><td><span class="tag blue">${p.traits}</span></td><td><button class="btn sm secondary" onclick="playerModal(${p.id})">PROFILE</button></td></tr>`).join('')}</tbody></table></div></div></div>`}
function playerModal(id){let p=state.roster.find(p=>p.id===id);modal(`<div class="rowp">${port(p)}<div><h2>${p.name.toUpperCase()}</h2><div class="muted">#${p.number} • ${p.pos} • ${['Freshman','Sophomore','Junior','Senior'][p.year-1]} • ${p.traits}</div></div></div><div class="sep"></div><div class="statnum" style="color:var(--lime)">${p.ovr} OVR</div>${[['Shooting',p.shoot],['Defense',p.def],['Athleticism',p.ath],['Potential',p.pot],['Morale',p.mood]].map(([l,v])=>`<div class="bar"><label>${l}</label><div class="progress"><span style="width:${v}%"></span></div><span>${v}</span></div>`).join('')}<div class="sep"></div><div class="tiny">${p.games} games played • ${p.ppg?p.ppg.toFixed(1):'0.0'} PPG • ${p.apg?p.apg.toFixed(1):'0.0'} APG • ${p.rpg?p.rpg.toFixed(1):'0.0'} RPG</div><div style="margin-top:18px"><button class="btn secondary" onclick="closeModal()">BACK TO ROSTER</button></div>`)}
function recruiting(){let prospects=state.recruits.filter(p=>!p.signed&&(recruitFilter==='all'||p.stars===+recruitFilter)).sort((a,b)=>b.ovr-a.ovr);return header('The recruiting trail','FUTURE STARS','Build relationships, compete for prospects, and win signing day.')+`<div class="grid">${stat('AVAILABLE NIL / SCOUT CASH','$'+state.budget)}${stat('SIGNED RECRUITS',state.recruits.filter(r=>r.signed).length)}${stat('OPEN SCHOLARSHIPS',15-state.roster.length-state.recruits.filter(r=>r.signed).length)}${stat('SCOUTING NETWORK','LVL '+state.scouting)}<div class="card span12"><div class="section-head"><h3>THE BIG BOARD</h3><div class="tabs" style="margin:0">${['all','5','4','3'].map(f=>`<button class="${recruitFilter===f?'active':''}" onclick="recruitFilter='${f}';render()">${f==='all'?'ALL':f+'★'}</button>`).join('')}</div></div><div class="grid">${prospects.map(p=>`<div class="span4 choice"><div class="flex"><div class="rowp">${port(p)}<div><h4>${p.name}</h4><div class="tiny">${p.pos} • ${'★'.repeat(p.stars)} • ${p.traits}</div></div></div><span class="rating">${p.ovr}</span></div><div class="sep"></div><div class="flex"><span class="muted">Recruiting interest</span><strong>${p.interest}%</strong></div><div class="progress" style="margin:8px 0 15px"><span style="width:${p.interest}%"></span></div><div class="flex"><button class="btn secondary sm" onclick="scout(${p.id})" ${state.budget<80?'disabled':''}>SCOUT $80</button><button class="btn sm" onclick="pitch(${p.id})" ${state.budget<p.cost?'disabled':''}>PITCH $${p.cost}</button></div><div class="tiny" style="margin-top:10px">${p.interest>=75?'READY TO COMMIT — one good pitch could seal it':'Pitch increases interest. At 75+%, prospects may commit.'}</div></div>`).join('')||'<div class="span12 muted">No prospects in this category.</div>'}</div></div></div>`}
function scout(id){let p=state.recruits.find(x=>x.id===id);if(state.budget<80)return;state.budget-=80;p.interest=clamp(p.interest+rand(5,12)+state.scouting*2,0,99);addNews(`${p.name} was spotted touring campus after a strong recruiting push.`);save();render();toast(`${p.name}: interest now ${p.interest}%`)}
function pitch(id){let p=state.recruits.find(x=>x.id===id);if(state.budget<p.cost)return;state.budget-=p.cost;let gain=rand(13,27)+Math.round(state.prestige/16),old=p.interest;p.interest=clamp(p.interest+gain,0,100);let signed=p.interest>=78&&Math.random()<(p.interest-55)/40;if(signed){if(state.roster.length+state.recruits.filter(x=>x.signed).length>=15){toast('Scholarship limit reached!');save();render();return}p.signed=true;p.scholarship=true;addNews(`BREAKING: ${p.stars}★ ${p.pos} ${p.name} commits to ${myTeam().name}!`);achievement('First commitment');toast(`COMMITTED! ${p.name} is coming to campus.`)}else{addNews(`${p.name} heard your NIL pitch: interest ${old}% → ${p.interest}%.`);toast(`Interest increased to ${p.interest}%`)}save();render()}
function training(){return header('Player development','THE LAB','What you do during the week shows up under the lights.')+`<div class="grid"><div class="card span8"><h3>CHOOSE YOUR DEVELOPMENT FOCUS</h3><div class="grid">${[['balanced','⚖','Balanced Program','Small improvements across the entire squad. Keeps chemistry healthy.'],['shooting','◎','Shooting Factory','Raise shooting attributes. Small risk of fatigue.'],['defense','⬡','Defensive Identity','Improve defensive IQ, stops, and toughness.'],['conditioning','ϟ','Athletic Performance','Athleticism and endurance with fatigue recovery.']].map(([id,ic,name,desc])=>`<div class="span6 choice" style="border-color:${state.training===id?'var(--lime)':''}"><div class="eyebrow">${ic} ${state.training===id?'ACTIVE FOCUS':''}</div><h4>${name}</h4><p>${desc}</p><button class="btn ${state.training===id?'secondary':''}" onclick="state.training='${id}';save();render()">${state.training===id?'SELECTED':'SET FOCUS'}</button></div>`).join('')}</div></div><div class="card span4"><h3>STAFF & FACILITIES</h3><p class="muted">Invest in lasting program infrastructure.</p><div class="sep"></div><h4>Training Facility — Level ${state.facilities}</h4><p class="tiny">Better player development every week.</p><button class="btn secondary sm" onclick="upgrade('facilities')" ${state.budget<500||state.facilities>=5?'disabled':''}>UPGRADE $500</button><div class="sep"></div><h4>Recruiting Department — Level ${state.scouting}</h4><p class="tiny">More effective campus scouting.</p><button class="btn secondary sm" onclick="upgrade('scouting')" ${state.budget<450||state.scouting>=5?'disabled':''}>UPGRADE $450</button></div><div class="card span12"><h3>TEAM DEVELOPMENT WATCHLIST</h3>${state.roster.slice(0,6).map(p=>`<div class="listrow"><div class="rowp">${port(p)}<div><strong>${p.name}</strong><div class="tiny">Potential ceiling ${p.pot} OVR</div></div></div><div style="width:140px"><div class="flex"><span class="tiny">GROWTH TRACK</span><b>${p.ovr}</b></div><div class="progress" style="margin-top:7px"><span style="width:${p.ovr/p.pot*100}%"></span></div></div></div>`).join('')}</div></div>`}
function upgrade(k){let cost=k==='facilities'?500:450;if(state.budget<cost||state[k]>=5)return;state.budget-=cost;state[k]++;addNews(`${myTeam().name} unveils upgraded ${k==='facilities'?'training facilities':'recruiting operations'}.`);save();render();toast('Program upgraded!')}
function rankings(){let t=PROGRAMS.map(x=>({...x,score:x.prestige+rand(-8,8)+(x.abbr===state.team?state.wins*1.2-state.losses*.8:0)})).sort((a,b)=>b.score-a.score);return header('Around the country','NATIONAL PULSE','Fictional in-game power rankings, updated as your dynasty progresses.')+`<div class="grid"><div class="card span7"><h3>THE FULL COURT TOP 20</h3>${t.map((x,i)=>`<div class="listrow" style="${x.abbr===state.team?'background:#263d35;padding:10px;border-radius:9px':''}"><div class="who"><span style="font:900 24px Impact,'Arial Narrow',sans-serif;width:32px;color:${i<4?'var(--lime)':'#97a8b3'}">${i+1}</span>${teamIcon(x)}<div><strong>${x.name}</strong><div class="tiny">${x.conference}</div></div></div><span class="tag ${x.abbr===state.team?'':'blue'}">${Math.round(x.score)} PWR</span></div>`).join('')}</div><div class="card span5"><h3>THE ROAD TO THE TOURNAMENT</h3><div class="statnum" style="font-size:65px;color:var(--lime)">${state.wins>=15?'IN':state.wins>=9?'BUBBLE':'WORK'}</div><div class="statlab">PROJECTED TOURNAMENT STATUS</div><p class="sub">Win meaningful games. Strengthen your record. Make March unforgettable.</p><div class="sep"></div><h3>HEADLINES</h3>${state.news.slice(0,6).map(x=>`<div class="news"><p>${escapeHTML(x)}</p></div>`).join('')}</div></div>`}
function legacy(){return header('History books','BUILD THE LEGACY','A dynasty is more than one season.')+`<div class="grid">${stat('COACH WINS',state.history.reduce((a,s)=>a+s.wins,0)+state.wins)}${stat('SEASONS COACHED',state.history.length+1)}${stat('TROPHY CASE',state.achievements.length)}${stat('PROGRAM PRESTIGE',state.prestige)}<div class="card span7"><h3>THE TROPHY ROOM</h3><div class="grid">${(state.achievements.length?state.achievements:['Win your first game','Sign your first recruit','Reach the tournament','Win the championship']).map(a=>`<div class="span6 choice"><div style="font-size:29px;margin-bottom:10px">🏆</div><strong>${a}</strong><p>${state.achievements.includes(a)?'Unlocked':'A new milestone awaits.'}</p></div>`).join('')}</div></div><div class="card span5"><h3>COACHING RESUME</h3><div class="eyebrow">${escapeHTML(state.coach)}</div><h2 style="font:900 33px Impact,'Arial Narrow',sans-serif">${myTeam().name.toUpperCase()}</h2><p class="muted">A career in the making.</p><div class="sep"></div>${state.history.map(s=>`<div class="listrow"><strong>${s.season}–${String(s.season+1).slice(2)}</strong><span>${s.wins}-${s.losses} • ${s.finish}</span></div>`).join('')||'<div class="tiny">Your first season is in progress.</div>'}<div class="sep"></div><button class="btn secondary" onclick="openSettings()">SAVE / RESET OPTIONS</button></div></div>`}
function game(){let g=state.game,n=nextGame(),opp=g?getTeam(g.op):n?getTeam(n.op):null;if(!opp){return header('The postseason','THE BIG DANCE','Your regular season is complete.')+postseason()};return header('Courtside','GAME DAY',g?'The ball is live. Every possession matters.':`${myTeam().name} ${n.home?'hosts':'travels to'} ${opp.name}.`,g?'':`<button class="btn secondary sm" onclick="simulate()">QUICK SIM →</button>`)+`<div class="grid"><div class="card span12"><div class="gamebox"><div class="flex"><span class="tag">${g?`2ND HALF • ${Math.max(0,Math.ceil(g.time/4))}:00 LEFT`:'PREGAME • ARENA READY'}</span><span class="muted">${g?'LIVE SIMULATION':n?.home?'HOME COURT ADVANTAGE':'ROAD TEST'}</span></div><div class="scoreboard" style="margin:26px 0"><div>${teamIcon(myTeam(),true)}<h3>${myTeam().name}</h3><div class="score">${g?g.us:0}</div></div><div class="vs">${g?'–':'VS'}</div><div>${teamIcon(opp,true)}<h3>${opp.name}</h3><div class="score">${g?g.them:0}</div></div></div><div class="court"><div class="half"></div><div class="circle"></div><div class="paint left"></div><div class="paint right"></div>${Array.from({length:10},(_,i)=>`<div class="dot ${i>4?'away':''}" style="left:${i>4?55+(i-5)*9:10+i*8}%;top:${i%5*15+13}%">${i%5+1}</div>`).join('')}</div>${!g?`<div class="grid"><div class="span4"><div class="tiny">OFFENSIVE SCHEME</div><select class="select" style="width:100%" onchange="state.scheme=this.value;save()">${[['balanced','Balanced'],['threes','Let It Fly (3PT)'],['inside','Attack the Paint'],['defense','Defense First']].map(([v,l])=>`<option value="${v}" ${state.scheme===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="span4"><div class="tiny">GAME TEMPO</div><select class="select" style="width:100%" onchange="state.pace=this.value;save()"><option value="normal" ${state.pace==='normal'?'selected':''}>Controlled</option><option value="fast" ${state.pace==='fast'?'selected':''}>Run & Gun</option><option value="slow" ${state.pace==='slow'?'selected':''}>Slow It Down</option></select></div><div class="span4" style="align-self:end"><button class="btn" style="width:100%" onclick="startGame()">TIP OFF →</button></div></div>`:`<div class="controlbar"><button class="btn" onclick="tickGame(1)">RUN 1 MIN →</button><button class="btn secondary" onclick="tickGame(5)">RUN 5 MIN →</button><button class="btn ghost" onclick="tickGame(40)">SIM TO FINAL »</button><select class="select" onchange="state.scheme=this.value;save();render()">${[['balanced','Balanced'],['threes','Let It Fly'],['inside','Attack Paint'],['defense','Lockdown']].map(([v,l])=>`<option value="${v}" ${state.scheme===v?'selected':''}>${l}</option>`).join('')}</select><select class="select" onchange="state.pace=this.value;save();render()"><option value="normal" ${state.pace==='normal'?'selected':''}>Controlled</option><option value="fast" ${state.pace==='fast'?'selected':''}>Fast Pace</option><option value="slow" ${state.pace==='slow'?'selected':''}>Slow Tempo</option></select></div>`}</div></div><div class="card span7"><h3>PLAY-BY-PLAY</h3><div class="eventbox">${(g?.events||['Coaches shake hands at midcourt. The student section is on its feet.']).map((e,i)=>`<div class="event ${i===0?'big':''}">${escapeHTML(e)}</div>`).join('')}</div></div><div class="card span5"><h3>SCOUTING REPORT</h3><div class="flex"><span class="muted">YOUR TEAM RATING</span><span class="rating">${avg()}</span></div><div class="sep"></div><div class="flex"><span class="muted">OPPONENT POWER</span><span class="rating" style="color:var(--orange)">${opp.prestige}</span></div><div class="sep"></div><div class="tiny">${state.scheme==='threes'?'Live and die by the three. Higher ceiling, greater variance.':state.scheme==='inside'?'High percentage looks inside, with a risk of turnovers.':state.scheme==='defense'?'Lower possessions, more stops. Grind it out.':'A balanced approach to both ends of the floor.'}</div><div class="sep"></div><span class="tag blue">${state.roster[0]?.name} • ${state.roster[0]?.traits}</span></div></div>`}
function startGame(){let n=nextGame();if(!n)return;state.game={op:n.op,time:40,us:0,them:0,events:['TIP-OFF! A new chapter begins.']};save();render()}
function tickGame(minutes){if(!state.game)return;let g=state.game;let duration=Math.min(minutes,g.time);for(let i=0;i<duration;i++){let ours=avg(),op=getTeam(g.op),energy=state.chemistry*.07+state.momentum*.04+(nextGame()?.home?3:0),edge=(ours-op.prestige)*.15+energy-7;let poss=state.pace==='fast'?rand(2,4):state.pace==='slow'?rand(1,2):rand(2,3);for(let j=0;j<poss;j++){let who=Math.random()<clamp(.50+edge/100,.28,.72)?'us':'them',points=Math.random()<(state.scheme==='threes'&&who==='us'?.39:.31)?3:2,prob=who==='us'?clamp(.55+edge/180+(state.scheme==='inside'?.05:0)-(state.scheme==='threes'?.07:0),.3,.75):clamp(.50-edge/180-(state.scheme==='defense'?.05:0),.28,.72);if(Math.random()<prob){g[who]+=points;if(Math.random()<.48)g.events.unshift(`${40-g.time+i+1}' ${who==='us'?sample(state.roster.slice(0,7)).name:op.mascot+' offense'} scores ${points}! ${g.us}–${g.them}`)}}}g.time-=duration;g.events=g.events.slice(0,24);if(g.time<=0){if(g.us===g.them){g.us+=rand(4,12);g.them+=rand(3,11);if(g.us===g.them)g.us++}endGame()}save();render()}
function simulate(){startGame();tickGame(40)}
function endGame(){let g=state.game,n=nextGame(),win=g.us>g.them;n.played=true;n.win=win;n.score=g.us;n.theirs=g.them;state.wins+=win?1:0;state.losses+=win?0:1;if(n.conference){state.confW+=win?1:0;state.confL+=win?0:1}state.week++;state.momentum=clamp(state.momentum+(win?rand(3,8):-rand(4,9)),12,99);state.fans=clamp(state.fans+(win?rand(2,7):-rand(3,6)),14,99);state.prestige=clamp(state.prestige+(win&&getTeam(n.op).prestige>83?1:0),35,99);state.budget+=rand(85,165)+(win?45:0);state.chemistry=clamp(state.chemistry+rand(-2,4),25,98);develop();let opponent=getTeam(g.op);addNews(`${win?'FINAL: '+myTeam().name+' wins!':'Heartbreak for '+myTeam().name+'.'} ${g.us}–${g.them} ${win?'over':'against'} ${opponent.name}. ${win?'The student section is electric.':'Back to the drawing board.'}`);if(state.wins===1)achievement('First win');if(state.wins===10)achievement('Double-digit wins');state.game=null;modal(`<div class="eyebrow">THE FINAL BUZZER</div><h2 style="font-size:53px;color:${win?'var(--lime)':'var(--orange)'}">${win?'VICTORY.':'TOUGH LOSS.'}</h2><div class="scoreboard" style="margin:27px 0"><div><strong>${myTeam().abbr}</strong><div class="score">${g.us}</div></div><span class="vs">FINAL</span><div><strong>${opponent.abbr}</strong><div class="score">${g.them}</div></div></div><p class="sub">The season rolls on. Your record is now ${record()}. You earned new recruiting cash and your players completed a development week.</p><button class="btn" onclick="closeModal();goto('dashboard')">BACK TO CAMPUS →</button>`)}
function develop(){state.roster.forEach(p=>{let chance=.12+state.facilities*.05+(state.training==='balanced'?.04:.02);if(Math.random()<chance&&p.ovr<p.pot){p.ovr++;if(state.training==='shooting')p.shoot=clamp(p.shoot+rand(1,2),1,99);if(state.training==='defense')p.def=clamp(p.def+rand(1,2),1,99);if(state.training==='conditioning')p.ath=clamp(p.ath+rand(1,2),1,99)}p.games++;p.ppg=(p.ppg*(p.games-1)+rand(2,23))/(p.games);p.apg=(p.apg*(p.games-1)+rand(0,7))/p.games;p.rpg=(p.rpg*(p.games-1)+rand(0,9))/p.games})}
function postseason(){return `<div class="grid"><div class="card span8"><div class="eyebrow">SELECTION SUNDAY</div><h3>${state.tourney?'MARCH MADNESS':'SEASON RECAP'}</h3><div class="statnum">${record()}</div><p class="sub">${state.wins>=12?'Your team is in the conversation for the national tournament.':'Your season has concluded. Keep building for next year.'}</p><div class="sep"></div>${state.tourney?`<div class="banner">${state.round>=4?'NATIONAL CHAMPIONS!':'Tournament round '+(state.round+1)+' — every game is elimination.'}</div><button class="btn" onclick="playTournament()" ${state.round>=4?'disabled':''}>${state.round>=4?'CHAMPIONSHIP WON':'PLAY NEXT TOURNAMENT GAME →'}</button>`:state.wins>=12?`<button class="btn" onclick="state.tourney=true;addNews('SELECTION SUNDAY: '+myTeam().name+' earns a tournament bid!');achievement('March Madness berth');save();render()">ACCEPT TOURNAMENT BID →</button>`:`<div class="tag red">NO TOURNAMENT BID</div>`}<div class="sep"></div><button class="btn secondary" onclick="newSeason()">${state.tourney&&state.round<4?'END TOURNEY & ':''}ADVANCE TO NEXT SEASON →</button></div><div class="card span4"><h3>WHAT'S NEXT?</h3><p class="sub">Graduation, player growth, recruiting commitments, new opponents, and a fresh season.</p><p class="tiny">Be careful: advancing is permanent in this save.</p></div></div>`}
function playTournament(){let odds=clamp(.27+(avg()-80)*.019+state.momentum*.001, .12,.8);let win=Math.random()<odds;let op=sample(PROGRAMS.filter(x=>x.abbr!==state.team&&x.prestige>=77));let us=rand(62,88)+(win?rand(2,10):0),them=rand(65,90)+(win?0:rand(3,10));if(win&&us<=them)us=them+rand(1,7);if(!win&&us>=them)them=us+rand(1,7);state.wins+=win?1:0;state.losses+=win?0:1;if(win){state.round++;state.budget+=250;addNews(`MARCH MAGIC: ${myTeam().name} beats ${op.name}, ${us}-${them}, to advance!`);if(state.round===4)achievement('National Champions')}else{state.round=99;addNews(`The dream ends against ${op.name}, ${us}-${them}. A postseason to remember.`)}modal(`<div class="eyebrow">THE BIG DANCE</div><h2>${win?'SURVIVE & ADVANCE!':'THE ROAD ENDS HERE.'}</h2><div class="statnum">${us} – ${them}</div><p class="sub">${myTeam().name} vs ${op.name}</p><button class="btn" onclick="closeModal();render()">CONTINUE →</button>`);save();render()}
function newSeason(){if(state.game)return;let seniors=state.roster.filter(p=>p.year===4);let incoming=state.recruits.filter(r=>r.signed).map(r=>({...r,year:1,games:0,ppg:0,apg:0,rpg:0}));state.history.push({season:state.season,wins:state.wins,losses:state.losses,finish:state.round===4?'Champions':state.tourney?'Tournament':'Regular season'});state.roster=state.roster.filter(p=>p.year<4).map(p=>({...p,year:p.year+1,ovr:clamp(p.ovr+rand(0,3),0,p.pot)})).concat(incoming);let id=rand(400,3000);while(state.roster.length<10)state.roster.push(makePlayer(id++,Math.round((state.prestige-78)/6)));state.roster=state.roster.slice(0,15).sort((a,b)=>b.ovr-a.ovr);state.season++;state.week=0;state.wins=0;state.losses=0;state.confW=0;state.confL=0;state.tourney=false;state.round=0;state.recruits=Array.from({length:9},(_,i)=>createRecruit(rand(1000,9999)+i));state.schedule=Array.from({length:22},(_,i)=>({op:sample(PROGRAMS.filter(t=>t.abbr!==state.team)).abbr,home:i%3!==1,played:false,conference:i>=7&&i<20}));state.budget+=500;addNews(`A new era begins. ${seniors.length} seniors graduated and ${incoming.length} recruits arrived on campus.`);save();render();toast('New season underway!')}
function addNews(msg){state.news.unshift(msg);state.news=state.news.slice(0,22)}function achievement(x){if(!state.achievements.includes(x))state.achievements.push(x)}function toast(s){let el=$('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3300)}function modal(html){const root=$('#modal');root.innerHTML=`<div class="modal">${html}</div>`;root.classList.toggle('setup-mode',html.includes('NEW DYNASTY / CREATE YOUR LEGACY'));root.classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
function openSettings(){modal(`<div class="eyebrow">DYNASTY MANAGEMENT</div><h2>THE FRONT OFFICE</h2><p class="sub">Your career automatically saves in this browser after every decision. No account needed.</p><div class="sep"></div><button class="btn secondary" onclick="exportSave()">EXPORT SAVE FILE ↓</button> <button class="btn secondary" onclick="document.getElementById('importSave').click()">IMPORT SAVE FILE ↑</button><input id="importSave" type="file" accept="application/json,.json" style="display:none" onchange="importSave(this)"><div class="sep"></div><button class="btn ghost" onclick="if(confirm('Delete this dynasty and start over? This cannot be undone.')){localStorage.removeItem('fullcourt_dynasty_v2');state=null;closeModal();setup()}" style="color:var(--red)">RESET DYNASTY</button> <button class="btn" onclick="closeModal()">DONE</button>`)}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fullcourt-dynasty-save.json';a.click();URL.revokeObjectURL(url)}
function importSave(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!data.team||!Array.isArray(data.roster)||!Array.isArray(data.schedule))throw Error('Invalid save');state=data;save();closeModal();render();toast('Save imported!')}catch(e){toast('Invalid save file')}};r.readAsText(f)}
let selected=0;function chooseSchool(i){let coach=document.getElementById('coachName')?.value||'Coach Carter';selected=i;setup();document.getElementById('coachName').value=coach}function setup(){modal(`<div class="eyebrow">NEW DYNASTY / CREATE YOUR LEGACY</div><h2>WELCOME TO FULL COURT.</h2><p class="sub">Choose a school. Name your coach. Take over the program and chase March.</p><label class="field">HEAD COACH NAME</label><input class="input" id="coachName" maxlength="30" value="Coach Carter"/><label class="field">CHOOSE YOUR PROGRAM</label><div class="program-list">${PROGRAMS.map((t,i)=>`<div class="program-option ${selected===i?'selected':''}" onclick="chooseSchool(${i})">${teamIcon(t)}<div><strong>${t.name} ${t.mascot}</strong><div class="tiny">${t.conference} • PRESTIGE ${t.prestige}</div></div></div>`).join('')}</div><div class="setup-action"><button class="btn" style="width:100%" onclick="state=defaultState(selected,document.getElementById('coachName').value.trim()||'Coach Carter');save();closeModal();goto('dashboard')">TAKE THE JOB →</button></div><p class="tooltip">Fictional player rosters and simulated results. School names are for fan-made gameplay; not affiliated with NCAA teams.</p>`)}
try{let old=JSON.parse(localStorage.getItem('fullcourt_dynasty_v2'));if(old?.version===2&&old.roster?.length&&old.schedule){state=old;render()}else setup()}catch(e){setup()}
</script><script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
